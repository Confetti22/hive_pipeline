              # '/home/confetti/data/rm009/boundary_seg/new_boundary_seg_data/z_slices',   #25824#
]

# train_paths: ['/home/confetti/data/rm009/boundary_seg/new_boundary_seg_data/1zmlp_rois']
# train_paths: ['/share/home/shiqiz/data/rm009/boundary_seg/new_boundary_seg_data/z_slices']

# Student
student_type: tinyvit # or tinyvit
tinyvit_input_type: rgb # or grayscale (only used when student_type: tinyvit)
tinyvit_implementation: timm # or timm (only used when student_type: tinyvit)

# Data Preprocessing
crop_size: null # Optional central crop size (e.g., 224, 256, 512). If null, no cropping is applied.
use_mixup:  False # Apply mixup augmentation with coefficients sampled uniformly from [0,1]
use_aug: True

# TinyViT Model Architecture (only used when student_type: tinyvit)
tinyvit_depth: 12 # Number of transformer layers (6-24 recommended)
tinyvit_embed_dim: 192 # Embedding dimension (96, 192, 384, 768 recommended)
tinyvit_num_heads: 3     # Number of attention heads (auto-calculated if not specified)
tinyvit_mlp_ratio: 4.0   # MLP expansion ratio (4.0 recommended)

# Feature Layer Selection (1-based indices)
teacher_feature_layers: [2,5,12]  # Which teacher layers to extract features from
student_feature_layers: [2,5,12]  # Which student layers to extract features from

# Loss Weight Configuration
lambda_feat: 1.0    # Weight for feature mimicry loss (cosine similarity)
lambda_aff: 0    # Weight for affinity preservation loss (local structure)

# Feature Loss Type Configuration
feature_loss_type: cosine # Options: "cosine" (default) or "mse" for direct MSE loss without normalization

use_spatial_coords: false

# Optimization
batch_size: 16
epochs: 500
lr: 0.0005
weight_decay: 0.05
num_workers: 4

# Learning Rate Scheduler
scheduler_type: None # Options: cosine, step, exponential, cosine_warmup, None
scheduler_warmup_epochs: 5     # Number of warmup epochs (only used with cosine_warmup)
scheduler_min_lr: 1e-6         # Minimum learning rate (used with cosine schedulers)

# Model Saving
save_every_epoch: 5           # Save student weights every N epochs (0 to disable)
save_dir: ./runs/_distill_cnn_test10_tinyvittimm_mullayer_nomixup_cosine_proj_t1779 # Directory to save model checkpoints
